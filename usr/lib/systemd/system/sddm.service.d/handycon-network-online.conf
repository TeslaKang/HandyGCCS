# Installed by HandyGCCS (handycon).
# When Steam (gamescope-session) is started before the network is up at boot,
# Steam does not initialize the Guide button chord, so Guide/QAM do nothing
# until the session is restarted. Start the display manager after network-online.
# No effect if NetworkManager-wait-online.service is disabled.
[Unit]
Wants=network-online.target
After=network-online.target
